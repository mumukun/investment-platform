<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>订阅席位全览 · 交互原型</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f2ec;color:#22241f;font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1280px;margin:auto;padding:32px 28px}header,section,aside{background:#fffdf9;border:1px solid #ddd8ce;border-radius:12px;padding:20px 24px;margin-bottom:15px}header{background:transparent;border:0;padding:0}h1{font-size:29px;margin:5px 0}h2{font-size:18px;margin:0}h3{font-size:15px}p{margin:5px 0;color:#62675e}button,select{font:inherit;background:#fffdf9;border:1px solid #d5d1ca;border-radius:7px;padding:5px 11px;color:inherit;cursor:pointer}button.active,button[aria-pressed=true]{color:#5544ac;border-color:#988ad1;background:#f0ecfb}button:focus-visible,select:focus-visible{outline:3px solid #9785db}nav,.controls,.summary,.chips{display:flex;align-items:center;flex-wrap:wrap;gap:8px}nav{border-bottom:1px solid #d8d5cc;margin-top:14px}nav span{padding:7px 10px;color:#686a63}nav b{padding:7px 10px;border-bottom:3px solid #7763ca;color:#5544ac}.controls{margin:12px 0}.summary{gap:20px;margin:13px 0;color:#54594f}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14px}td,th{padding:10px 6px;border-bottom:1px solid #ede9e2;text-align:left}th{font-weight:500;color:#63665d}td.money,th.money{text-align:right;white-space:nowrap}.up{color:#b63d4d}.down{color:#19735b}.muted{color:#696d65}.pending{color:#945d18}button.link{background:none;border:none;color:#6350ae;padding:2px 5px;text-align:left}.strips{display:flex;align-items:center;gap:2px;height:25px}.strips i{display:block;width:6px}.pos{background:#c95665}.neg{background:#47917a}.empty{background:#dcd8ce}.tag{font-size:12px;color:#795612;background:#f7efd9;padding:2px 6px;border-radius:4px;margin-left:4px}.flex{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.sub{font-size:13px}.chips button{font-size:14px}dialog{border:1px solid #cec9bf;border-radius:12px;background:#fffdf9;color:inherit;width:min(600px,94vw);max-height:85vh;padding:22px}dialog::backdrop{background:#24221d55}@media(max-width:700px){main{padding:15px 10px}section,aside{padding:14px 12px}.wrap table,.wrap tbody{display:block}.wrap thead{display:none}.wrap tr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:3px 8px;border-bottom:1px solid #ddd8ce;padding:10px 0}.wrap td{display:block;border:0;padding:2px}.wrap td:before{content:attr(data-title);display:block;color:#707169;font-size:12px}.wrap td:first-child,.wrap td:last-child{grid-column:1/-1}.wrap td.money{text-align:left}nav{font-size:12px}}
</style><main><header><p class="sub">投研看板 / 席位订阅与复盘</p><h1>订阅席位全览</h1><p>交互原型 · 以下席位交易、个股名称及盘面均为合成示例。</p><nav><b>席位全览</b><span>关注日报</span><span>席位详情</span><span>复盘记录</span></nav></header>
<section><div class="flex"><h2>全部订阅席位</h2><label>观察日 <select id="day"></select></label></div><div class="controls" id="ranges"><button value="1">当日</button><button value="5">近 5 个交易日</button><button value="20">近 20 个交易日</button></div><div class="summary" id="counts"></div><div class="wrap"><table><thead><tr><th>营业部</th><th>观察日状态</th><th class="money">公开买入</th><th class="money">公开卖出</th><th class="money">净额</th><th>逐日净额</th><th>参与个股</th></tr></thead><tbody id="rows"></tbody></table></div><p class="sub">金额单位为万元。红柱为公开净买，绿柱为公开净卖，灰点表示没有可计算的净额。区间汇总仅含可比单日披露。</p></section>
<section><h2>个股与席位交集</h2><p class="sub">按参与席位数排列。点击股票，展开逐日席位买卖和同日盘面。</p><div id="stocks" class="chips"></div></section>
<dialog id="detail"><div class="flex"><h2 id="title"></h2><button onclick="detail.close()">关闭</button></div><div id="body"></div></dialog></main>
<script>
const seats=['示例 · 紫阳东路','示例 · 知春路','示例 · 浦东南路','示例 · 湖滨路','示例 · 人民中路','示例 · 建设路'], names=['云帆光电','远川设备','东岭材料','江源电子','启明制造'];
const dates=[];for(let d=new Date('2026-11-26T12:00:00Z');dates.length<25;d.setUTCDate(d.getUTCDate()-1)){if(![6,0].includes(d.getUTCDay()))dates.unshift(d.toISOString().slice(0,10))}
const facts=[];dates.forEach((d,i)=>seats.forEach((s,j)=>{if(i===24)return;if((i*7+j*3)%5>1)return;facts.push({i,j,k:(i+j)%5,b:330+(i*81+j*120)%2800,s:220+(i*138+j*43)%3000})}));
[[0,0,3200,180],[1,0,180,1900],[1,1,1500,80],[2,1,1900,250],[2,2,50,800],[3,3,670,630]].forEach(([j,k,b,s])=>facts.push({i:24,j,k,b,s}));
const tape=(i,k)=>['收盘封涨停','地天板 · 收盘封涨停','炸板未回封','普通交易','行情待核验'][(24-i+k)%5];
let end=24,n=1;const options=document.querySelector('#day');dates.forEach((d,i)=>{if(i>=19)options.add(new Option(d,i))});options.value=end;options.onchange=()=>{end=Number(options.value);render()};document.querySelectorAll('#ranges button').forEach(b=>b.onclick=()=>{n=Number(b.value);render()});
const inRange=()=>facts.filter(f=>f.i<=end&&f.i>end-n);const fmt=v=>v.toLocaleString('zh-CN');const sum=(a,k)=>a.reduce((v,f)=>v+f[k],0);
function render(){document.querySelectorAll('#ranges button').forEach(b=>b.setAttribute('aria-pressed',Number(b.value)===n));const data=inRange(),today=data.filter(f=>f.i===end),hits=new Set(today.map(f=>f.j)).size,pending=end===24?1:0;counts.textContent='订阅 '+seats.length+' 家　·　观察日有披露 '+hits+' 家　·　待更新 '+pending+' 家　·　已查无披露 '+(seats.length-hits-pending)+' 家';rows.innerHTML=seats.map((s,j)=>{const a=data.filter(f=>f.j===j),status=today.some(f=>f.j===j)?'有披露':end===24&&j===5?'待更新':'已查无披露',net=sum(a,'b')-sum(a,'s');
const trend=dates.slice(end-n+1,end+1).map((d,off)=>{const z=a.filter(f=>f.i===end-n+1+off),v=sum(z,'b')-sum(z,'s');return '<i title="'+d+' '+(z.length?fmt(v)+' 万':'无可比金额')+'" class="'+(v>0?'pos':v<0?'neg':'empty')+'" style="height:'+Math.min(24,3+Math.abs(v)/140)+'px"></i>'}).join('');
return '<tr><td><b>'+s+'</b></td><td data-title="观察日状态" class="'+(status==='待更新'?'pending':'muted')+'">'+status+'</td>'+['b','s'].map((k,idx)=>'<td class="money" data-title="'+['买入','卖出'][idx]+'">'+(a.length?fmt(sum(a,k)):'—')+'</td>').join('')+'<td class="money '+(net>0?'up':'down')+'" data-title="净额">'+(a.length?(net>0?'+':'')+fmt(net):'—')+'</td><td data-title="逐日净额"><div class="strips">'+trend+'</div></td><td data-title="参与个股">'+([...new Set(a.map(f=>f.k))].map(k=>'<button class="link" onclick="openStock('+k+')">'+names[k]+'</button>').join('')||'—')+'</td></tr>'}).join('');
const stocksByCount=names.map((name,k)=>({k,name,count:new Set(data.filter(f=>f.k===k).map(f=>f.j)).size})).filter(v=>v.count).sort((a,b)=>b.count-a.count);stocks.innerHTML=stocksByCount.map(v=>'<button onclick="openStock('+v.k+')">'+v.name+' · '+v.count+' 席'+(n===1?'<span class="tag">'+tape(end,v.k)+'</span>':'')+'</button>').join('')||'本区间暂无公开记录'}
function openStock(k){title.textContent=names[k];const a=inRange().filter(f=>f.k===k);body.innerHTML=[...new Set(a.map(f=>f.i))].sort((x,y)=>y-x).map(i=>'<h3>'+dates[i]+' <span class="tag">'+tape(i,k)+'</span></h3>'+a.filter(f=>f.i===i).map(f=>'<p>'+seats[f.j]+'　买 '+fmt(f.b)+' 万　卖 '+fmt(f.s)+' 万　净额 '+fmt(f.b-f.s)+' 万</p>').join('')).join('')+'<p class="sub">席位金额来自当日公开披露，成交发生的具体时点未知。</p>';detail.showModal()}render();
</script></html>
