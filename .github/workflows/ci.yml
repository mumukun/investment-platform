name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  release-controller:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.8', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q scripts tests
      - run: bash -n deploy/install-nas-image-release.sh && sh -n deploy/nas-image-release
