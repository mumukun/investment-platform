schema_version: "1.0"
template: true

# Allowed lifecycle examples: DRAFT, READY_FOR_FORMAL_RELEASE, IN_PROGRESS, RELEASED,
# BLOCKED, FAILED, PARTIAL, ROLLED_BACK, CANCELLED.
release_id: null
status: DRAFT
# Routine is the default; extra checks follow actual migration/contract/deployment impact.
release_profile: routine
# Start at the submit/merge/prepare request (or formal request if direct), including assistant and CI wait.
# Separate prepare/deploy durations and user authorization waiting; never deploy on prepare-only authorization.
release_target_seconds: 300
assistant_review_target_seconds: 60
created_at: null
updated_at: null

changes: []

# Populate one entry per changed repository with repository, previous/new version, commit_sha,
# tag, artifact/digest, retained rollback identity and CI/candidate evidence links.
# Omit unchanged/inapplicable fields; keep identity here once rather than duplicate it at the top level.
repositories: []

# Optional CI_BUILD_ONCE inputs/evidence; historical SOURCE_TAG_BUILD remains supported.
image_execution_plan: null
candidate_evidence: []
deployment_receipts: []

dependencies: []
release_order: []

deployment:
  environment: null
  status: NOT_STARTED
  started_at: null
  completed_at: null

# Actual runtime identities, backup details and stage checks come from deployment_receipts.
# Add only checks or limitations not already captured there. Keep image-release-v1 plan schema unchanged.
verification:
  status: NOT_STARTED
  evidence: []
  known_limitations: []

rollback:
  status: NOT_STARTED
  # Per-repository rollback identity is above; link receipt for the protected backup/restore point.
  evidence: []

notes: []
